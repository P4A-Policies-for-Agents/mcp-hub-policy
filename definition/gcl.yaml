---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: MCP Hub Policy
    description: |
      Aggregates multiple upstream MCP (Model Context Protocol) servers
      behind a single virtual `/mcp` endpoint. Implements the MCP
      Streamable HTTP transport: aggregates `tools/list`, `resources/list`,
      `prompts/list` from every configured upstream and routes
      `tools/call`, `resources/read`, `prompts/get` to the owning server.
      Per-server authentication and arbitrary headers are configured
      declaratively in API Manager.
    category: MCP
    metadata/interfaceScope: api,resource
    metadata/capabilities/injectionPoint: inbound
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    # ------------------------------------------------------------------
    # Hub-level surface
    # ------------------------------------------------------------------
    mcpEndpoint:
      type: string
      default: /mcp
      description: |
        Public path on the governed API where the virtual MCP endpoint is
        served. Defaults to `/mcp`. The policy intercepts POST/GET to
        this path and orchestrates calls to the configured upstream MCP
        servers.
    strictMode:
      type: boolean
      default: true
      description: |
        When true, requests that do not match the MCP endpoint are
        short-circuited with a 404. When false, non-MCP requests fall
        through to the configured Flex Gateway upstream.
    collisionStrategy:
      type: string
      enum:
        - prefix
        - reject
        - firstWins
        - lastWins
      default: prefix
      description: |
        How to handle duplicate tool / resource / prompt names across
        upstream MCP servers when aggregating manifests.
        - prefix: rename to `<serverName>_<originalName>` (default).
        - reject: fail aggregation with an MCP-compliant error.
        - firstWins: keep the first server's entry, drop subsequent dupes.
        - lastWins: overwrite with the most recently seen entry.
    aggregationTimeoutMs:
      type: integer
      minimum: 100
      maximum: 60000
      default: 5000
      description: |
        Per-upstream timeout (ms) when aggregating manifests
        (`tools/list`, `resources/list`, `prompts/list`). Upstreams are
        queried concurrently; slow upstreams are skipped with a warning
        rather than failing the aggregate. One budget covers the whole
        upstream call, including the session handshake (`initialize`,
        `notifications/initialized`).
    perRequestTimeoutMs:
      type: integer
      minimum: 100
      maximum: 600000
      default: 30000
      description: |
        Per-upstream timeout (ms) for routed `tools/call`,
        `resources/read`, `prompts/get` invocations. One budget covers the
        whole upstream call, including the session handshake and a retry
        after an expired upstream session.
    manifestCacheTtlSeconds:
      type: integer
      minimum: 0
      maximum: 86400
      default: 60
      description: |
        How long (seconds) each upstream's `tools/list`, `resources/list`
        and `prompts/list` answer is reused, per caller for passthrough
        servers. Failed answers are not cached. 0 disables the cache.
    diagnosticContinueFlow:
      type: boolean
      default: false
      description: |
        Deprecated and ignored. Kept so existing configurations remain
        valid.
    upstreamSessionTtlSeconds:
      type: integer
      minimum: 0
      maximum: 86400
      default: 1800
      description: |
        How long (seconds) the hub reuses an upstream MCP session id before
        re-initializing. Sessions for `authType=passthrough` servers are
        kept per caller credential, so users never share an upstream
        session. 0 disables reuse (initialize on every request). An
        upstream 404 on a cached session triggers an immediate
        re-initialize regardless of TTL.
    allowedOrigins:
      type: array
      description: |
        Allowed values of the inbound `Origin` header (e.g.
        `https://app.example.com`). When non-empty, requests carrying an
        `Origin` not in this list are rejected with 403, as required by the
        MCP Streamable HTTP transport. Leave empty to delegate Origin
        checks to a gateway CORS policy.
      items:
        type: string
    forwardHeaders:
      type: array
      description: |
        Inbound headers copied to the upstream of every routed call
        (`tools/call`, `resources/read`, `prompts/get`) when the caller sends
        them, for tracing and correlation. Not sent on handshakes, `*/list`
        or notifications. When unset, defaults to
        `traceparent`, `tracestate` and `x-correlation-id`; set an empty
        list to forward none. Transport headers, `authorization`,
        `proxy-authorization`, `cookie` and any header a server uses for
        authentication (including `customHeaders` entries) can't be
        listed. A server's own `headers` entry of the same name wins.
      items:
        type: string
    upstreamFailureBackoffSeconds:
      type: integer
      minimum: 0
      maximum: 3600
      default: 10
      description: |
        After an upstream fails its MCP handshake (unreachable or timed
        out, HTTP 408/429/5xx, JSON-RPC error, invalid answer), skip it
        for up to this many seconds instead of waiting on it again:
        `*/list` leaves it out and routed calls answer 503 with
        `Retry-After`. A shorter upstream `Retry-After` wins. A timeout
        only skips calls allowed as long or less, so a `*/list` timeout
        doesn't block routed calls. Other 4xx (which one caller's headers
        could cause) and 401/403 are not backed off. Tracked per caller
        credential for `authType=passthrough` servers. 0 disables it.
    exposeUpstreamErrors:
      type: boolean
      default: false
      description: |
        When true, `*/list` results name the servers that were left out
        and why in `_meta["mcp-hub/skipped"]` (reason codes
        `missing_credentials`, `unauthorized`, `unavailable`, `error`,
        `misconfigured`), and routed-call errors include up to 1 KB of the
        upstream's HTTP error body in `error.data.body`. Off by default
        because it reveals upstream details to callers.
    maxUpstreamResponseBytes:
      type: integer
      minimum: 1048576
      maximum: 67108864
      default: 8388608
      description: |
        Largest upstream response body (bytes) the hub parses and relays;
        larger answers fail with a JSON-RPC error naming the server.
        Default 8 MiB, range 1 MiB to 64 MiB.
    requireCallerAuth:
      type: boolean
      default: false
      description: |
        When true, every MCP POST without an `Authorization` header is
        answered 401 with `WWW-Authenticate` (pointing at the hub's
        protected-resource metadata when `authorizationServers` is set),
        so MCP clients start their OAuth flow when they connect. Only the
        header's presence is checked: validate tokens with a JWT policy or
        at the passthrough upstream.

    # ------------------------------------------------------------------
    # OAuth protected-resource metadata (RFC 9728)
    # ------------------------------------------------------------------
    resourceUrl:
      type: string
      description: |
        Canonical URL of this hub's MCP endpoint as clients see it (e.g.
        `https://gw.example.com/mcp-hub/mcp`). Required when
        `authorizationServers` is set. The hub serves its metadata at
        `<resourceUrl>/.well-known/oauth-protected-resource` and points
        `WWW-Authenticate` there on 401 responses.
    authorizationServers:
      type: array
      description: |
        Issuer URL(s) of the authorization server that mints the tokens
        callers forward to `authType=passthrough` servers. When set, the
        hub serves protected-resource metadata so MCP clients can discover
        where to log in.
      items:
        type: string
    scopesSupported:
      type: array
      description: |
        Optional `scopes_supported` advertised in the protected-resource
        metadata.
      items:
        type: string

    # ------------------------------------------------------------------
    # Upstream MCP server registry
    # ------------------------------------------------------------------
    mcpServers:
      type: array
      description: |
        Array of MCP server definitions. Each entry is an MCP Streamable
        HTTP endpoint that the hub aggregates. Maximum 50 entries.
      items:
        type: object
        properties:
          name:
            type: string
            description: |
              Logical server identifier. Used as the prefix when
              `collisionStrategy=prefix` and as the routing key for
              `<server>_<tool>` invocations. Must be unique and contain only
              letters, digits, `_` and `-`.
          endpoint:
            type: string
            format: service
            description: |
              MCP Streamable HTTP endpoint URL of the upstream MCP server.
              Registered as a Flex Gateway upstream service.
          enabled:
            type: boolean
            default: true
            description: |
              When false the server is skipped during aggregation and
              routing. Useful for temporarily disabling a server without
              removing its configuration.
          authType:
            type: string
            enum:
              - none
              - bearerToken
              - basicAuth
              - apiKeyHeader
              - customHeaders
              - passthrough
            default: none
            description: |
              Authentication strategy applied to outbound calls to this
              MCP server.
              - none: no auth header injected.
              - bearerToken: `Authorization: Bearer <token>`.
              - basicAuth: `Authorization: Basic base64(username:password)`.
              - apiKeyHeader: `<headerName>: <apiKey>`.
              - customHeaders: arbitrary headers from the `headers` array.
              - passthrough: forward the caller's own inbound header(s)
                (`headerName`, default `Authorization`) to this server only.
                List several comma-separated (e.g. `client_id, client_secret`
                for Client ID Enforcement); all must be present.
                Use when the caller's token is valid for the upstream as-is
                (e.g. a gateway in the same trust domain). Note: this is the
                MCP "token passthrough" pattern; it relies on the upstream
                accepting the hub's audience.
          token:
            type: string
            "@context":
              "@characteristics":
                - "security:sensitive"
            description: |
              Static bearer token. Required when `authType=bearerToken`.
          username:
            type: string
            description: |
              Basic auth username. Required when `authType=basicAuth`.
          password:
            type: string
            "@context":
              "@characteristics":
                - "security:sensitive"
            description: |
              Basic auth password. Required when `authType=basicAuth`.
          headerName:
            type: string
            description: |
              API-key header name (e.g. `x-api-key`). Required when
              `authType=apiKeyHeader`. With `authType=passthrough`, the
              inbound header(s) to forward, comma-separated (default
              `authorization`; e.g. `client_id, client_secret`).
          apiKey:
            type: string
            "@context":
              "@characteristics":
                - "security:sensitive"
            description: |
              API-key value. Required when `authType=apiKeyHeader`.
          headers:
            type: array
            description: |
              Additional HTTP headers attached to every outbound call to
              this server; an entry replaces any header of the same name
              the hub would send (auth scheme, passthrough, forwarded).
              Transport headers can't be set. When
              `authType=customHeaders`, the auth materials are sourced
              from this array.
            items:
              type: object
              properties:
                name:
                  type: string
                  description: HTTP header name.
                value:
                  type: string
                  "@context":
                    "@characteristics":
                      - "security:sensitive"
                  description: HTTP header value.
              required:
                - name
                - value
          timeoutMs:
            type: integer
            minimum: 100
            maximum: 600000
            description: |
              Per-server request timeout override. When unset the
              policy-wide `perRequestTimeoutMs` is used.
          priority:
            type: integer
            minimum: 0
            maximum: 100
            default: 50
            description: |
              Ordering hint when collisions occur with `firstWins` /
              `lastWins`. Lower numbers are considered first.
        required:
          - name
          - endpoint
  required:
    - mcpServers
