[package]
name = "mcp_hub"
version = "0.3.2"
rust-version = "1.88.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.anypoint]
group_id = "f684513f-280e-403a-ac53-80ca62e3de49"
definition_asset_id = "mcp-hub-policy"
implementation_asset_id = "mcp-hub-policy-impl"

[dependencies]
pdk = "1.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc", "preserve_order"] }
anyhow = "1.0"
thiserror = "1"
base64 = "0.22"
sha2 = "0.10"
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
pdk-unit = "1.8.0"

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
panic = "abort"
